<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1210">
  <title>Blockyard — Minecraft Server Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" data-view="servers" aria-label="Blockyard home" title="Open your servers">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-name">blockyard<span class="brand-period">.</span></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="servers" title="View your servers"><span class="nav-icon">▦</span>Servers<span class="nav-count" id="server-count">0</span></button>
        <button class="nav-item" data-view="discover" title="Find or import a modpack"><span class="nav-icon">⌕</span>Discover packs</button>
      </nav>

      <div class="server-list-heading"><span class="side-label">YOUR SERVERS</span><button class="icon-button add-small detect-small" data-action="detect-server-folders" title="Detect existing servers in the default server folder" aria-label="Detect existing servers">◎</button><button class="icon-button add-small" data-view="discover" title="Add a server from a modpack" aria-label="Add server">＋</button></div>
      <div class="server-list" id="server-list"></div>
      <div class="server-sections" id="server-sections"></div>

      <div class="sidebar-spacer"></div>
      <button class="nav-item settings-link" data-view="settings" title="Change Blockyard settings"><span class="nav-icon">⚙</span>Settings</button>
      <button class="nav-item quit-link" data-action="quit-app" title="Close Blockyard and stop managed servers" aria-label="Close Blockyard"><span class="nav-icon">⏻</span>Close Blockyard</button>
      <div class="sidebar-footer">
        <span class="online-indicator"></span><span>LOCAL INSTANCE</span><span class="version-tag">v1.0</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>BLOCKYARD</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">OVERVIEW</strong></div>
        <div class="topbar-right"><span class="secure-label"><span class="secure-dot"></span>PRIVATE · THIS DEVICE</span></div>
      </header>
      <div id="main-content" class="content"></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
